# 内网机 - 运行应用服务
# 通过 rathole 暴露到公网机
# PostgreSQL 和 Redis 使用外部服务

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acgn-flow-app
    restart: unless-stopped
    network_mode: host  # 使用宿主机网络，可直接访问 localhost 上的服务
    environment:
      - PORT=1270
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads

volumes:
  uploads:
