# ACGN Flow — 全容器化部署（app + postgres + redis + rathole 隧道客户端）
# 使用: docker compose up -d --build   或   podman compose up -d --build
#
# 宿主机不再安装 postgres / redis / pm2 / systemd —— 所有服务都跑在容器里。
# 变量从同目录的 .env 读取（见 .env.example）。

services:
  # ---------- PostgreSQL ----------
  postgres:
    image: postgres:16-alpine
    container_name: acgn-flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acgn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acgn_password}
      POSTGRES_DB: ${POSTGRES_DB:-acgn_flow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 仅容器内网可达，不向宿主机暴露端口。
    # 需要本机连库调试时临时取消注释（仅绑定 loopback）:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acgn} -d ${POSTGRES_DB:-acgn_flow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: acgn-flow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 数据库 schema 初始化（一次性，prisma db push）----------
  # 每次 up 都会跑一遍，db push 是幂等的：schema 已对齐即为 no-op。
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: acgn-flow-migrate
    container_name: acgn-flow-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-acgn}:${POSTGRES_PASSWORD:-acgn_password}@postgres:5432/${POSTGRES_DB:-acgn_flow}?schema=public

  # ---------- Next.js 应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:1270}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ACGN Flow}
    image: acgn-flow-app
    container_name: acgn-flow-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      - NODE_ENV=production
      - PORT=1270
      # 数据库 / 缓存（容器内网 DNS）
      - DATABASE_URL=postgresql://${POSTGRES_USER:-acgn}:${POSTGRES_PASSWORD:-acgn_password}@postgres:5432/${POSTGRES_DB:-acgn_flow}?schema=public
      - REDIS_URL=redis://redis:6379
      # NextAuth
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost:1270}
      # OAuth（可选）
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID:-}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_DISCORD_ID=${AUTH_DISCORD_ID:-}
      - AUTH_DISCORD_SECRET=${AUTH_DISCORD_SECRET:-}
      # 应用配置（NEXT_PUBLIC_* 仅作服务端兜底，客户端值在构建时已内联）
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:1270}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-ACGN Flow}
      # 邮件（可选）
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # 上传目录
      - UPLOAD_DIR=/app/uploads
      # IndexNow / Google / Bilibili（可选）
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY:-}
      - BILIBILI_COOKIE=${BILIBILI_COOKIE:-}
    volumes:
      - uploads:/app/uploads
      - ./data:/app/data:ro  # IP 地理位置数据库（只读）
    # 默认只把端口绑定到宿主机 loopback，供本机调试；
    # 对公网的暴露完全走 rathole 隧道，不直接开放。删掉这段也能正常跑（rathole 走容器内网）。
    ports:
      - "127.0.0.1:1270:1270"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1270/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------- Cloudflare Tunnel（当前对外暴露方式）----------
  # cloudflared 主动外连 Cloudflare 边缘：无需公网机 / nginx / 开放任何入站端口，
  # TLS、HTTP/3、CDN、防护都由 Cloudflare 边缘负责。
  # 在 Cloudflare Zero Trust → Networks → Tunnels 给该 tunnel 配置 Public Hostname:
  #   <你的域名>  ->  http://app:1270   （cloudflared 与 app 同处 compose 内网）
  cloudflared:
    image: cloudflare/cloudflared:2026.6.1
    container_name: acgn-flow-cloudflared
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # 从 Cloudflare 控制台复制的 tunnel token（见 .env）
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run

  # ---------- Rathole 隧道客户端（已停用，保留备用）----------
  # 默认不启动（profile）。需要切回时:
  #   1) 在 Cloudflare 侧停掉 tunnel，避免双通道
  #   2) docker compose --profile rathole up -d rathole
  #   3) docker compose stop cloudflared
  rathole:
    profiles: ["rathole"]
    build:
      context: .
      dockerfile: Dockerfile.rathole
      args:
        RATHOLE_VERSION: ${RATHOLE_VERSION:-v0.5.0}
    image: acgn-flow-rathole
    container_name: acgn-flow-rathole
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # 复制 deploy/rathole-client.example.toml -> deploy/rathole-client.toml 并填写公网机 IP/token
      - ./deploy/rathole-client.toml:/config/client.toml:ro
    command: ["-c", "/config/client.toml"]

volumes:
  postgres_data:
    name: acgn-flow-postgres-data
  redis_data:
    name: acgn-flow-redis-data
  uploads:
    name: acgn-flow-uploads
