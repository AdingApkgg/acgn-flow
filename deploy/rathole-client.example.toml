# Rathole 客户端配置 - 内网机
# 将本地服务暴露到公网机

[client]
remote_addr = "公网机IP:2333"  # 修改为你的公网机 IP 和 rathole 服务端口
default_token = "your-secret-token"  # 修改为你的密钥

[client.transport]
type = "tcp"

[client.services.acgn-web]
local_addr = "127.0.0.1:3000"

[client.services.acgn-artalk]
local_addr = "127.0.0.1:8080"

# 如果需要暴露上传文件目录（通过 nginx 静态服务）
# [client.services.acgn-uploads]
# local_addr = "127.0.0.1:8081"
